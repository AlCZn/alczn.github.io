<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然单行式子 → LaTeX 转换器</title>
<!-- MathJax：实时渲染预览 -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
    /* ==========================================================================
       Design System v1 —— 中性深色
       本块为四个页面共用的同一份 token，修改时请同步全部页面。
       ========================================================================== */
    :root {
        color-scheme: dark;

        /* 表面 */
        --bg: #0b0d0f;
        --bg-2: #101317;
        --panel: #14171b;
        --panel-2: #191d22;
        --line: #23282f;
        --line-strong: #333a43;

        /* 文字 */
        --ink: #e8ebef;
        --muted: #98a3ae;
        --faint: #6b7580;

        /* 强调（单一中性强调色） */
        --accent: #8fa3b8;
        --accent-ink: #10141a;
        --accent-soft: #232b34;
        --accent-line: #5c6d7f;

        /* 语义色 */
        --teal: #5fd0b0;
        --blue: #62a8f0;
        --amber: #d9a441;
        --green: #8fc76a;
        --red: #e0666a;

        /* 形状与节奏 */
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 16px;
        --gap: 14px;

        /* 字体 */
        --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto,
            "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        --font-mono: "SFMono-Regular", "SF Mono", "JetBrains Mono", "Fira Code",
            "Cascadia Code", Consolas, monospace;

        /* 页面局部：代码与预览 */
        --code-bg: #0a0c0f;
        --preview-bg: #f2f4f7;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
            radial-gradient(circle at 12% 0%, rgba(143, 163, 184, .07), transparent 30rem),
            radial-gradient(circle at 90% 100%, rgba(95, 208, 176, .05), transparent 32rem),
            var(--bg);
        font-family: var(--font-sans);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }

    /* —— 排版 —— */
    .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: .2em;
        text-transform: uppercase;
    }

    .page-title {
        margin: 0;
        font-size: clamp(30px, 5vw, 46px);
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -.04em;
    }

    .subtitle {
        max-width: 46rem;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 14px;
    }

    /* —— 布局 —— */
    .app-shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 26px; }
    .tablet { width: min(880px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 26px; }

    .site-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
    }

    .header-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 4px;
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 12px;
    }

    /* —— 通用面板 —— */
    .panel { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
    .panel.pad { padding: 20px; }

    /* —— 按钮 —— */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--panel-2);
        color: var(--ink);
        font-size: 13.5px;
        cursor: pointer;
        transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .btn:hover { border-color: var(--line-strong); background: #20252b; }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn.primary { border-color: var(--accent-line); background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .btn.primary:hover { background: #a4b6c8; border-color: var(--accent); }
    .btn.full { width: 100%; }
    .btn.chip { padding: 6px 12px; border-radius: 999px; color: var(--muted); font-size: 12.5px; font-family: var(--font-mono); }
    .btn.chip:hover { color: var(--ink); }

    /* —— 表单 —— */
    .field { display: grid; gap: 8px; color: var(--muted); font-size: 12.5px; }

    select, input[type="text"], input[type="number"], textarea {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--bg-2);
        color: var(--ink);
        font-size: 13.5px;
        font-family: inherit;
    }

    select:focus, input:focus, textarea:focus { border-color: var(--accent-line); outline: none; }

    /* —— 分区 —— */
    .section { display: grid; gap: 11px; }
    .section + .section { border-top: 1px solid var(--line); padding-top: 18px; }
    .section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: .14em;
        text-transform: uppercase;
    }

    /* —— 徽标 —— */
    .badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg-2);
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
    }

    /* —— 页脚 —— */
    .site-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        margin-top: 22px;
        padding: 16px 4px 0;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-size: 12px;
    }

    /* ====================== 页面：LaTeX 转换器 ====================== */
    .stack { display: grid; gap: 16px; }

    .subhead {
        margin: 0;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-left: 2px solid var(--accent-line);
        border-radius: 0 var(--r-sm) var(--r-sm) 0;
        background: var(--bg-2);
        color: var(--muted);
        font-size: 13px;
    }

    .subhead code {
        padding: 2px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-2);
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: 12px;
    }

    textarea {
        min-height: 84px;
        resize: vertical;
        font-family: var(--font-mono);
        font-size: 15px;
        line-height: 1.6;
    }

    textarea:focus { border-color: var(--accent-line); }

    .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .code-block {
        min-height: 76px;
        margin: 0;
        padding: 16px 18px;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--code-bg);
        color: #cfd8e3;
        font-family: var(--font-mono);
        font-size: 14px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .preview-area {
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--preview-bg);
    }

    .preview-label {
        margin-bottom: 12px;
        color: #6b7480;
        font-size: 11px;
        letter-spacing: .14em;
        text-transform: uppercase;
    }

    .preview-content {
        display: flex;
        align-items: center;
        min-height: 52px;
        overflow-x: auto;
        color: #101317;
        font-size: 20px;
    }

    .example-row { display: flex; flex-wrap: wrap; gap: 8px; }

    @media (max-width: 620px) {
        .app-shell, .tablet { width: min(100% - 28px, 880px); padding-top: 22px; }
        .site-header { display: block; }
        .header-meta { margin-top: 14px; }
        .panel.pad { padding: 16px; }
        .preview-content { font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
    }
</style>
</head>
<body>
    <main class="tablet">
        <header class="site-header">
            <div>
                <p class="eyebrow">Toolkit / 02</p>
                <h1 class="page-title">自然式子 → LaTeX</h1>
                <p class="subtitle">把随手写的单行式子，整理成可以粘进文档的 LaTeX 代码。</p>
            </div>
            <span class="header-meta">MATHJAX 3</span>
        </header>

        <div class="panel pad">
            <div class="stack">
                <p class="subhead">
                    输入形如 <code>3x/2 + 1/x</code> 的式子，自动转为 <code>\frac{3x}{2} + \frac{1}{x}</code>
                </p>

                <div class="field">
                    <label for="inputExpr">自然单行式子</label>
                    <textarea id="inputExpr" rows="2" spellcheck="false" placeholder="例如: 3x/2 + 1/x 或 (a+b)/c - d/(e+f)">3x/2+1/x</textarea>
                </div>

                <div class="row-between">
                    <span class="section-title" style="letter-spacing:.14em">LaTeX 代码</span>
                    <button class="btn chip" id="copyBtn" type="button">
                        <span id="copyLabel">复制</span>
                    </button>
                </div>
                <pre class="code-block" id="latexOutput">\frac{3x}{2}+\frac{1}{x}</pre>

                <div class="preview-area">
                    <div class="preview-label">渲染预览</div>
                    <div class="preview-content" id="preview"></div>
                </div>

                <div class="section">
                    <div class="section-title"><span>示例</span></div>
                    <div class="example-row">
                        <button class="btn chip example-chip" type="button" data-expr="3x/2+1/x">3x/2+1/x</button>
                        <button class="btn chip example-chip" type="button" data-expr="(a+b)/c">(a+b)/c</button>
                        <button class="btn chip example-chip" type="button" data-expr="x^2/(y+1) + 3y/4">x^2/(y+1)+3y/4</button>
                        <button class="btn chip example-chip" type="button" data-expr="1/(x+1) - 2/(x-1)">1/(x+1)-2/(x-1)</button>
                        <button class="btn chip example-chip" type="button" data-expr="(2x+3)/(x^2-1)">(2x+3)/(x^2-1)</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <span>NA2LA / 单行转换</span>
            <span>支持嵌套括号 · 除法转分数，尽量保持原式结构</span>
        </footer>
    </main>

<script>
    (function() {
        const inputExpr = document.getElementById('inputExpr');
        const latexOutput = document.getElementById('latexOutput');
        const previewDiv = document.getElementById('preview');
        const copyBtn = document.getElementById('copyBtn');
        const copyLabel = document.getElementById('copyLabel');
        const exampleChips = document.querySelectorAll('.example-chip');

        // ---------- 核心转换函数：自然式子 -> LaTeX ----------
        // 约定（见页头说明）：
        //   3x/2+1/x        ->  \frac{3x}{2}+\frac{1}{x}
        //   (a+b)/c         ->  \frac{(a+b)}{c}
        //   x^2/(y+1)+3y/4  ->  \frac{x^2}{(y+1)}+\frac{3y}{4}
        //   1/(x+1)-2/(x-1) ->  \frac{1}{(x+1)}-\frac{2}{(x-1)}
        // 除号只改写它左右两侧紧邻的操作数，其余字符原样保留。

        const OPERAND_CHAR = /[A-Za-z0-9.^_]/;

        // 从 index 起若是一个完整的括号组，返回该组之后的下标，否则返回 index
        function skipGroup(text, index) {
            if (text[index] !== "(") return index;
            let depth = 0;
            for (let i = index; i < text.length; i++) {
                if (text[i] === "(") depth++;
                else if (text[i] === ")") {
                    depth--;
                    if (depth === 0) return i + 1;
                }
            }
            return text.length;
        }

        // 判断 text[i] 处的 '-' 是否属于后面的操作数（负号）而不是二元减号。
        // 只有紧跟在运算符（+ - * /）之后的 '-' 才是负号，如 x/-2 与 x*-2；
        // "-2/3" 这种开头的负号由 takeLeftOperand 走到下标 0 时自然包含。
        function isUnaryMinus(text, i) {
            return text[i] === "-" && i > 0 && "*/+-".includes(text[i - 1]);
        }

        // 向左取一个操作数（分子的起点）
        function takeLeftOperand(text, end) {
            let i = end;
            while (i > 0) {
                const ch = text[i - 1];
                if (ch === ")") {
                    let depth = 0;
                    let j = i - 1;
                    for (; j >= 0; j--) {
                        if (text[j] === ")") depth++;
                        else if (text[j] === "(") {
                            depth--;
                            if (depth === 0) break;
                        }
                    }
                    if (j < 0) break;
                    i = j;
                } else if (OPERAND_CHAR.test(ch)) {
                    i--;
                } else if (ch === "-" && isUnaryMinus(text, i - 1)) {
                    i--; // 负号算作操作数的一部分：-x/2
                } else {
                    break;
                }
            }
            return i;
        }

        // 向右取一个操作数（分母的终点）
        function takeRightOperand(text, start) {
            let i = start;
            while (i < text.length) {
                const ch = text[i];
                if (ch === "(") i = skipGroup(text, i);
                else if (OPERAND_CHAR.test(ch)) i++;
                else if (ch === "-" && isUnaryMinus(text, i)) i++;
                else break;
            }
            return i;
        }

        function convertToLatex(input) {
            if (!input || typeof input !== "string") return "";
            const cleaned = input.replace(/\s+/g, "");
            if (cleaned === "") return "";

            function rewrite(text) {
                // 先递归处理括号内部，使括号里的除号也能被改写
                let out = "";
                let i = 0;
                while (i < text.length) {
                    if (text[i] === "(") {
                        const after = skipGroup(text, i);
                        const closed = after > i && text[after - 1] === ")";
                        const inner = closed ? text.slice(i + 1, after - 1) : text.slice(i + 1, after);
                        out += "(" + rewrite(inner) + (closed ? ")" : "");
                        i = after;
                    } else {
                        out += text[i];
                        i++;
                    }
                }

                // 改写本层（括号外）最靠左的一个除号，然后继续
                let depth = 0;
                let slash = -1;
                for (let k = 0; k < out.length; k++) {
                    const ch = out[k];
                    if (ch === "(") depth++;
                    else if (ch === ")") depth--;
                    else if (ch === "/" && depth === 0) {
                        slash = k;
                        break;
                    }
                }
                if (slash === -1) return out;

                const leftStart = takeLeftOperand(out, slash);
                const rightEnd = takeRightOperand(out, slash + 1);
                const numerator = out.slice(leftStart, slash) || "1";
                const denominator = out.slice(slash + 1, rightEnd) || "1";

                return (
                    rewrite(out.slice(0, leftStart)) +
                    `\\frac{${rewrite(numerator)}}{${rewrite(denominator)}}` +
                    rewrite(out.slice(rightEnd))
                );
            }

            return rewrite(cleaned);
        }

        // ---------- 更新界面 ----------
        function updateConversion() {
            const input = inputExpr.value;
            const latex = convertToLatex(input);
            latexOutput.textContent = latex || '\\text{(空)}';

            // 更新预览 (用 MathJax 渲染)
            // 清空预览并插入新的公式
            previewDiv.innerHTML = '';
            const formulaSpan = document.createElement('span');
            // 为了防止 MathJax 处理错误，包裹在 \( ... \) 中
            formulaSpan.textContent = `\\(${latex}\\)`;
            previewDiv.appendChild(formulaSpan);

            // 通知 MathJax 重新渲染
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([previewDiv]).catch((err) => {
                    console.warn('MathJax 渲染出错:', err);
                });
            } else {
                // 如果 MathJax 还没加载完，延迟重试
                setTimeout(() => {
                    if (window.MathJax && MathJax.typesetPromise) {
                        MathJax.typesetPromise([previewDiv]).catch(() => {});
                    }
                }, 300);
            }
        }

        // 防抖，避免频繁更新 MathJax
        let debounceTimer;
        function debouncedUpdate() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                updateConversion();
            }, 120);
        }

        // 监听输入
        inputExpr.addEventListener('input', debouncedUpdate);

        // 初始化：加载时执行一次
        window.addEventListener('load', () => {
            // 稍微延迟等待 MathJax 加载
            setTimeout(updateConversion, 100);
        });

        // 复制按钮
        copyBtn.addEventListener('click', async () => {
            const latex = latexOutput.textContent;
            if (!latex || latex === '\\text{(空)}') return;
            try {
                await navigator.clipboard.writeText(latex);
                // 临时反馈
                copyLabel.textContent = '已复制';
                setTimeout(() => {
                    copyLabel.textContent = '复制';
                }, 1500);
            } catch (err) {
                alert('复制失败，请手动复制');
            }
        });

        // 示例芯片点击
        exampleChips.forEach(chip => {
            chip.addEventListener('click', () => {
                const expr = chip.getAttribute('data-expr');
                if (expr) {
                    inputExpr.value = expr;
                    // 立即更新（不用防抖）
                    updateConversion();
                    inputExpr.focus();
                }
            });
        });

        // 处理 MathJax 动态加载完成后的重新渲染
        if (window.MathJax) {
            MathJax.startup.promise.then(() => {
                updateConversion();
            }).catch(() => {});
        } else {
            // 如果 MathJax 尚未加载，监听脚本加载完成
            const checkMathJax = setInterval(() => {
                if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
                    clearInterval(checkMathJax);
                    MathJax.startup.promise.then(() => {
                        updateConversion();
                    }).catch(() => {});
                }
            }, 100);
            setTimeout(() => clearInterval(checkMathJax), 5000);
        }

    })();
</script>
</body>
</html>
