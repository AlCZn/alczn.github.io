<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命游戏 | Conway's Game of Life</title>
    <style>
        :root {
            --ink: #e8f0ea;
            --muted: #91a49a;
            --line: rgba(169, 207, 184, .16);
            --panel: rgba(18, 29, 25, .82);
            --panel-strong: #17251f;
            --accent: #c8f169;
            --accent-dark: #17220e;
            --teal: #75e0c2;
            --shadow: 0 22px 70px rgba(0, 0, 0, .32);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 8%, rgba(117, 224, 194, .13), transparent 29rem),
                radial-gradient(circle at 88% 82%, rgba(200, 241, 105, .08), transparent 32rem),
                #0d1512;
            font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
        }

        button, input, select { font: inherit; }

        button {
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 10px 14px;
            color: var(--ink);
            background: #1b2c25;
            cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
        }

        button:hover { border-color: rgba(200, 241, 105, .7); background: #243a2f; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .app-shell { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 28px; }

        header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 24px; }
        .eyebrow { margin: 0 0 8px; color: var(--teal); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(32px, 5vw, 58px); line-height: .95; letter-spacing: -.045em; }
        .subtitle { max-width: 360px; margin: 0 0 4px; color: var(--muted); line-height: 1.6; font-size: 14px; }

        .layout { display: grid; grid-template-columns: minmax(0, 1fr) 318px; gap: 18px; align-items: start; }
        .board-panel, .side-panel { border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(14px); }
        .board-panel { min-width: 0; padding: 14px; border-radius: 12px; }
        .board-topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 3px 5px 13px; color: var(--muted); font-size: 12px; }
        .live-state { display: inline-flex; align-items: center; gap: 8px; }
        .live-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        .live-state.paused::before { background: #687a70; box-shadow: none; }
        .canvas-wrap { position: relative; overflow: hidden; width: 100%; aspect-ratio: 1.55; min-height: 360px; border-radius: 7px; background: #0a100d; }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; image-rendering: pixelated; }
        .empty-hint { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: rgba(232, 240, 234, .3); font-size: 13px; }
        .empty-hint.hidden { display: none; }

        .side-panel { display: grid; gap: 22px; padding: 21px; border-radius: 12px; }
        .section { display: grid; gap: 11px; }
        .section + .section { border-top: 1px solid var(--line); padding-top: 20px; }
        .section-title { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
        .section-title strong { color: var(--ink); font-size: 22px; letter-spacing: -.03em; }
        .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .button-row .primary { color: var(--accent-dark); border-color: var(--accent); background: var(--accent); font-weight: 700; }
        .button-row .primary:hover { background: #d9fb8b; }
        .full { width: 100%; }
        label { display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        select { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 10px; color: var(--ink); background: #17251f; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
        .stat { padding: 12px; border: 1px solid var(--line); border-radius: 7px; background: rgba(255,255,255,.025); }
        .stat span { display: block; color: var(--muted); font-size: 11px; }
        .stat strong { display: block; margin-top: 4px; color: var(--teal); font-size: 20px; }
        .tip { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
        kbd { border: 1px solid var(--line); border-bottom-color: #607b6d; border-radius: 4px; padding: 1px 5px; color: var(--ink); background: #17251f; }
        footer { display: flex; justify-content: space-between; gap: 15px; padding: 18px 4px 0; color: #687a70; font-size: 12px; }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .side-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
            .section + .section { border-top: 0; padding-top: 0; }
            .section:nth-child(3) { grid-column: 1 / -1; }
        }
        @media (max-width: 600px) {
            .app-shell { width: min(100% - 22px, 1440px); padding-top: 24px; }
            header { display: block; }
            .subtitle { margin-top: 14px; }
            .canvas-wrap { min-height: 230px; aspect-ratio: 1.05; }
            .side-panel { grid-template-columns: 1fr; }
            .section:nth-child(3) { grid-column: auto; }
            footer { display: block; line-height: 1.7; }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header>
            <div>
                <p class="eyebrow">Cellular automata / 01</p>
                <h1>生命游戏</h1>
            </div>
            <p class="subtitle">没有玩家，只有规则。让简单的邻居关系，在网格上长出复杂的秩序。</p>
        </header>

        <div class="layout">
            <section class="board-panel" aria-label="生命游戏棋盘">
                <div class="board-topline">
                    <span id="liveState" class="live-state paused">已暂停</span>
                    <span><span id="gridLabel">80 × 52</span> · 点击细胞进行编辑</span>
                </div>
                <div class="canvas-wrap">
                    <canvas id="lifeCanvas" aria-label="可交互的生命游戏网格"></canvas>
                    <div id="emptyHint" class="empty-hint">点击棋盘放置细胞，或载入一个预设</div>
                </div>
            </section>

            <aside class="side-panel">
                <section class="section">
                    <div class="section-title"><span>运行控制</span><strong id="generation">0000</strong></div>
                    <div class="button-row">
                        <button id="playButton" class="primary" type="button">开始</button>
                        <button id="stepButton" type="button">单步</button>
                    </div>
                    <button id="clearButton" class="full" type="button">清空棋盘</button>
                </section>

                <section class="section">
                    <div class="section-title"><span>实验参数</span><span id="speedValue">8 tps</span></div>
                    <label>运行速度<input id="speedInput" type="range" min="1" max="20" value="8"></label>
                    <label>随机填充<input id="densityInput" type="range" min="5" max="70" value="25"></label>
                    <button id="randomButton" class="full" type="button">随机生成</button>
                </section>

                <section class="section">
                    <div class="section-title"><span>预设图案</span></div>
                    <select id="patternSelect" aria-label="选择预设图案">
                        <option value="glider">滑翔机 · Glider</option>
                        <option value="pulsar">脉冲星 · Pulsar</option>
                        <option value="acorn">橡果 · Acorn</option>
                        <option value="gosper">滑翔机炮 · Gosper Gun</option>
                    </select>
                    <button id="loadButton" class="full" type="button">载入预设</button>
                    <div class="stats">
                        <div class="stat"><span>存活细胞</span><strong id="population">0</strong></div>
                        <div class="stat"><span>峰值细胞</span><strong id="peak">0</strong></div>
                    </div>
                    <p class="tip"><kbd>Space</kbd> 开始 / 暂停　<kbd>N</kbd> 单步　<kbd>R</kbd> 随机</p>
                </section>
            </aside>
        </div>
        <footer><span>CONWAY / 1970</span><span>每个细胞都只看见它周围的八个邻居</span></footer>
    </main>

    <script>
        const canvas = document.getElementById("lifeCanvas");
        const context = canvas.getContext("2d");
        const liveState = document.getElementById("liveState");
        const playButton = document.getElementById("playButton");
        const generationLabel = document.getElementById("generation");
        const populationLabel = document.getElementById("population");
        const peakLabel = document.getElementById("peak");
        const emptyHint = document.getElementById("emptyHint");
        const speedInput = document.getElementById("speedInput");
        const speedValue = document.getElementById("speedValue");
        const densityInput = document.getElementById("densityInput");
        const gridLabel = document.getElementById("gridLabel");

        const columns = 80;
        const rows = 52;
        let cells = new Uint8Array(columns * rows);
        let generation = 0;
        let peak = 0;
        let running = false;
        let timer = null;

        const patterns = {
            glider: ["010", "001", "111"],
            pulsar: [
                "0011100011100", "0000000000000", "1000101010001", "1000101010001", "1000101010001",
                "0011100011100", "0000000000000", "0011100011100", "1000101010001", "1000101010001",
                "1000101010001", "0000000000000", "0011100011100"
            ],
            acorn: ["0100000", "0001000", "1100111", "0001001", "0000001", "0000010"],
            gosper: [
                "000000000000000000000000100000000000", "000000000000000000000000010000000000", "000000000000000000001100110000000000",
                "000000000000000000010000010000000000", "000000000000000000001100010000000000", "000000000000000000000000010000000000",
                "000000000000000000000000100000000000", "000000000011000000000000000000000000", "000000000011000000000000000000000000",
                "000000110000001100000000000000000000", "000001000100001100000000000000000000", "110000000100001100000000000000000000",
                "110000001000000110000000000000000000", "000000110000000110000000000000000000", "000000000000000000000000000000000000",
                "000000000000000000000000000000000000", "000000000000000000000000000000000000", "000000000000000000000000000000000000"
            ]
        };

        function cellIndex(x, y) { return y * columns + x; }

        function setPattern(pattern) {
            cells.fill(0);
            const offsetX = Math.floor((columns - pattern[0].length) / 2);
            const offsetY = Math.floor((rows - pattern.length) / 2);
            pattern.forEach((line, y) => [...line].forEach((value, x) => {
                if (value === "1") cells[cellIndex(offsetX + x, offsetY + y)] = 1;
            }));
            generation = 0;
            peak = countPopulation();
            updateLabels();
            draw();
        }

        function countPopulation() { return cells.reduce((total, cell) => total + cell, 0); }

        function nextGeneration() {
            const next = new Uint8Array(cells.length);
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < columns; x++) {
                    let neighbors = 0;
                    for (let yOffset = -1; yOffset <= 1; yOffset++) {
                        for (let xOffset = -1; xOffset <= 1; xOffset++) {
                            if (xOffset === 0 && yOffset === 0) continue;
                            const neighborX = (x + xOffset + columns) % columns;
                            const neighborY = (y + yOffset + rows) % rows;
                            neighbors += cells[cellIndex(neighborX, neighborY)];
                        }
                    }
                    const alive = cells[cellIndex(x, y)] === 1;
                    next[cellIndex(x, y)] = neighbors === 3 || (alive && neighbors === 2) ? 1 : 0;
                }
            }
            cells = next;
            generation++;
            peak = Math.max(peak, countPopulation());
            updateLabels();
            draw();
        }

        function draw() {
            const pixelRatio = window.devicePixelRatio || 1;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            canvas.width = Math.floor(width * pixelRatio);
            canvas.height = Math.floor(height * pixelRatio);
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            const cellWidth = width / columns;
            const cellHeight = height / rows;
            context.fillStyle = "#0a100d";
            context.fillRect(0, 0, width, height);
            context.strokeStyle = "rgba(138, 181, 155, .09)";
            context.lineWidth = 1;
            for (let x = 0; x <= columns; x++) {
                context.beginPath(); context.moveTo(x * cellWidth, 0); context.lineTo(x * cellWidth, height); context.stroke();
            }
            for (let y = 0; y <= rows; y++) {
                context.beginPath(); context.moveTo(0, y * cellHeight); context.lineTo(width, y * cellHeight); context.stroke();
            }
            context.fillStyle = "#c8f169";
            for (let y = 0; y < rows; y++) for (let x = 0; x < columns; x++) {
                if (cells[cellIndex(x, y)]) context.fillRect(x * cellWidth + 1, y * cellHeight + 1, Math.max(1, cellWidth - 2), Math.max(1, cellHeight - 2));
            }
            emptyHint.classList.toggle("hidden", countPopulation() > 0);
        }

        function updateLabels() {
            const population = countPopulation();
            generationLabel.textContent = String(generation).padStart(4, "0");
            populationLabel.textContent = population;
            peakLabel.textContent = peak;
            liveState.textContent = running ? "运行中" : "已暂停";
            liveState.classList.toggle("paused", !running);
            playButton.textContent = running ? "暂停" : "开始";
        }

        function setRunning(value) {
            running = value;
            clearInterval(timer);
            timer = running ? setInterval(nextGeneration, 1000 / Number(speedInput.value)) : null;
            updateLabels();
        }

        function randomize() {
            const density = Number(densityInput.value) / 100;
            cells = Uint8Array.from({ length: columns * rows }, () => Math.random() < density ? 1 : 0);
            generation = 0;
            peak = countPopulation();
            updateLabels();
            draw();
        }

        canvas.addEventListener("click", (event) => {
            const bounds = canvas.getBoundingClientRect();
            const x = Math.floor((event.clientX - bounds.left) / bounds.width * columns);
            const y = Math.floor((event.clientY - bounds.top) / bounds.height * rows);
            if (x >= 0 && x < columns && y >= 0 && y < rows) {
                cells[cellIndex(x, y)] = cells[cellIndex(x, y)] ? 0 : 1;
                peak = Math.max(peak, countPopulation());
                updateLabels();
                draw();
            }
        });

        playButton.addEventListener("click", () => setRunning(!running));
        document.getElementById("stepButton").addEventListener("click", nextGeneration);
        document.getElementById("clearButton").addEventListener("click", () => { setRunning(false); cells.fill(0); generation = 0; peak = 0; updateLabels(); draw(); });
        document.getElementById("randomButton").addEventListener("click", randomize);
        document.getElementById("loadButton").addEventListener("click", () => setPattern(patterns[document.getElementById("patternSelect").value]));
        speedInput.addEventListener("input", () => { speedValue.textContent = `${speedInput.value} tps`; if (running) setRunning(true); });
        window.addEventListener("resize", draw);
        document.addEventListener("keydown", (event) => {
            if (event.target.matches("input, select")) return;
            if (event.code === "Space") { event.preventDefault(); setRunning(!running); }
            if (event.key.toLowerCase() === "n") nextGeneration();
            if (event.key.toLowerCase() === "r") randomize();
        });

        gridLabel.textContent = `${columns} × ${rows}`;
        setPattern(patterns.glider);
    </script>
</body>
</html>
</head>
