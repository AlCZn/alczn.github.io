<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命游戏 · Conway's Game of Life</title>
<style>
    /* ==========================================================================
       Design System v1 —— 中性深色
       本块为四个页面共用的同一份 token，修改时请同步全部页面。
       ========================================================================== */
    :root {
        color-scheme: dark;

        /* 表面 */
        --bg: #0b0d0f;
        --bg-2: #101317;
        --panel: #14171b;
        --panel-2: #191d22;
        --line: #23282f;
        --line-strong: #333a43;

        /* 文字 */
        --ink: #e8ebef;
        --muted: #98a3ae;
        --faint: #6b7580;

        /* 强调（单一中性强调色） */
        --accent: #8fa3b8;
        --accent-ink: #10141a;
        --accent-soft: #232b34;
        --accent-line: #5c6d7f;

        /* 语义色 */
        --teal: #5fd0b0;
        --blue: #62a8f0;
        --amber: #d9a441;
        --green: #8fc76a;
        --red: #e0666a;

        /* 形状与节奏 */
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 16px;
        --gap: 14px;

        /* 字体 */
        --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto,
            "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        --font-mono: "SFMono-Regular", "SF Mono", "JetBrains Mono", "Fira Code",
            "Cascadia Code", Consolas, monospace;

        /* 页面局部：棋盘 */
        --board: #0e1114;
        --board-line: rgba(143, 163, 184, 0.08);
        --cell: var(--accent);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
            radial-gradient(circle at 12% 0%, rgba(143, 163, 184, .07), transparent 30rem),
            radial-gradient(circle at 90% 100%, rgba(95, 208, 176, .05), transparent 32rem),
            var(--bg);
        font-family: var(--font-sans);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }

    /* —— 排版 —— */
    .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: .2em;
        text-transform: uppercase;
    }

    .page-title {
        margin: 0;
        font-size: clamp(30px, 5vw, 46px);
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -.04em;
    }

    .subtitle {
        max-width: 46rem;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 14px;
    }

    /* —— 布局 —— */
    .app-shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 26px; }
    .tablet { width: min(880px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 26px; }

    .site-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
    }

    .header-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 4px;
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 12px;
    }

    /* —— 通用面板 —— */
    .panel { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
    .panel.pad { padding: 20px; }

    /* —— 按钮 —— */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--panel-2);
        color: var(--ink);
        font-size: 13.5px;
        cursor: pointer;
        transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .btn:hover { border-color: var(--line-strong); background: #20252b; }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn.primary { border-color: var(--accent-line); background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .btn.primary:hover { background: #a4b6c8; border-color: var(--accent); }
    .btn.full { width: 100%; }

    /* —— 表单 —— */
    .field { display: grid; gap: 8px; color: var(--muted); font-size: 12.5px; }

    input[type="range"] { width: 100%; height: 22px; accent-color: var(--accent); }

    select, input[type="text"], input[type="number"], textarea {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--bg-2);
        color: var(--ink);
        font-size: 13.5px;
        font-family: inherit;
    }

    select:focus, input:focus, textarea:focus { border-color: var(--accent-line); outline: none; }

    /* —— 分区 —— */
    .section { display: grid; gap: 11px; }
    .section + .section { border-top: 1px solid var(--line); padding-top: 18px; }
    .section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: .14em;
        text-transform: uppercase;
    }

    /* —— 徽标 / 状态 —— */
    .badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg-2);
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
    }

    .live-state {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 11.5px;
    }

    .live-state::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--teal);
        box-shadow: 0 0 10px rgba(95, 208, 176, .7);
    }

    .live-state.paused::before { background: var(--faint); box-shadow: none; }

    /* —— 页脚 —— */
    .site-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        margin-top: 22px;
        padding: 16px 4px 0;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-size: 12px;
    }

    /* ====================== 页面：生命游戏 ====================== */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--gap); align-items: start; }

    .board-topline {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 0 2px 12px;
        color: var(--faint);
        font-size: 12px;
    }

    .canvas-wrap {
        position: relative;
        overflow: hidden;
        width: 100%;
        aspect-ratio: 1.55;
        min-height: 340px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--board);
    }

    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; image-rendering: pixelated; }

    .empty-hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: var(--faint);
        font-size: 13px;
    }

    .empty-hint.hidden { display: none; }

    .side-panel { display: grid; gap: 18px; padding: 20px; }

    .section-title strong { color: var(--ink); font-size: 21px; font-weight: 600; letter-spacing: -.02em; font-family: var(--font-mono); }

    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .stat { padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg-2); }
    .stat span { display: block; color: var(--faint); font-size: 11px; }
    .stat strong { display: block; margin-top: 3px; color: var(--teal); font-size: 19px; font-weight: 600; font-family: var(--font-mono); }

    .tip { margin: 0; color: var(--faint); font-size: 12px; line-height: 1.8; }

    kbd {
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-bottom-color: var(--line-strong);
        border-radius: 4px;
        background: var(--bg-2);
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 11px;
    }

    @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
        .side-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
        .section + .section { border-top: 0; padding-top: 0; }
        .section:nth-child(3) { grid-column: 1 / -1; }
    }

    @media (max-width: 620px) {
        .app-shell, .tablet { width: min(100% - 28px, 1120px); padding-top: 22px; }
        .site-header { display: block; }
        .header-meta { margin-top: 14px; }
        .canvas-wrap { min-height: 220px; aspect-ratio: 1.05; }
        .side-panel { grid-template-columns: 1fr; }
        .section:nth-child(3) { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
    }
</style>
</head>
<body>
    <main class="app-shell">
        <header class="site-header">
            <div>
                <p class="eyebrow">Cellular automata / 01</p>
                <h1 class="page-title">生命游戏</h1>
                <p class="subtitle">没有玩家，只有规则。让简单的邻居关系，在网格上长出复杂的秩序。</p>
            </div>
            <span class="header-meta">CONWAY / 1970</span>
        </header>

        <div class="layout">
            <section class="panel pad" aria-label="生命游戏棋盘">
                <div class="board-topline">
                    <span id="liveState" class="live-state paused">已暂停</span>
                    <span><span id="gridLabel">80 × 52</span> · 点击细胞进行编辑</span>
                </div>
                <div class="canvas-wrap">
                    <canvas id="lifeCanvas" aria-label="可交互的生命游戏网格"></canvas>
                    <div id="emptyHint" class="empty-hint">点击棋盘放置细胞，或载入一个预设</div>
                </div>
            </section>

            <aside class="panel side-panel">
                <section class="section">
                    <div class="section-title"><span>运行控制</span><strong id="generation">0000</strong></div>
                    <div class="button-row">
                        <button id="playButton" class="btn primary" type="button">开始</button>
                        <button id="stepButton" class="btn" type="button">单步</button>
                    </div>
                    <button id="clearButton" class="btn full" type="button">清空棋盘</button>
                </section>

                <section class="section">
                    <div class="section-title"><span>实验参数</span><span id="speedValue">8 tps</span></div>
                    <label class="field">运行速度<input id="speedInput" type="range" min="1" max="20" value="8"></label>
                    <label class="field">随机填充<input id="densityInput" type="range" min="5" max="70" value="25"></label>
                    <button id="randomButton" class="btn full" type="button">随机生成</button>
                </section>

                <section class="section">
                    <div class="section-title"><span>预设图案</span></div>
                    <select id="patternSelect" aria-label="选择预设图案">
                        <option value="glider">滑翔机 · Glider</option>
                        <option value="pulsar">脉冲星 · Pulsar</option>
                        <option value="acorn">橡果 · Acorn</option>
                        <option value="gosper">滑翔机炮 · Gosper Gun</option>
                    </select>
                    <button id="loadButton" class="btn full" type="button">载入预设</button>
                    <div class="stats">
                        <div class="stat"><span>存活细胞</span><strong id="population">0</strong></div>
                        <div class="stat"><span>峰值细胞</span><strong id="peak">0</strong></div>
                    </div>
                    <p class="tip"><kbd>Space</kbd> 开始 / 暂停　<kbd>N</kbd> 单步　<kbd>R</kbd> 随机</p>
                </section>
            </aside>
        </div>

        <footer class="site-footer">
            <span>CONWAY / 1970</span>
            <span>每个细胞都只看见它周围的八个邻居</span>
        </footer>
    </main>

    <script>
        const canvas = document.getElementById("lifeCanvas");
        const context = canvas.getContext("2d");
        const liveState = document.getElementById("liveState");
        const playButton = document.getElementById("playButton");
        const generationLabel = document.getElementById("generation");
        const populationLabel = document.getElementById("population");
        const peakLabel = document.getElementById("peak");
        const emptyHint = document.getElementById("emptyHint");
        const speedInput = document.getElementById("speedInput");
        const speedValue = document.getElementById("speedValue");
        const densityInput = document.getElementById("densityInput");
        const gridLabel = document.getElementById("gridLabel");

        const columns = 80;
        const rows = 52;
        let cells = new Uint8Array(columns * rows);
        let generation = 0;
        let peak = 0;
        let running = false;
        let timer = null;

        const patterns = {
            glider: ["010", "001", "111"],
            pulsar: [
                "0011100011100", "0000000000000", "1000101010001", "1000101010001", "1000101010001",
                "0011100011100", "0000000000000", "0011100011100", "1000101010001", "1000101010001",
                "1000101010001", "0000000000000", "0011100011100"
            ],
            acorn: ["0100000", "0001000", "1100111", "0001001", "0000001", "0000010"],
            gosper: [
                "000000000000000000000000100000000000", "000000000000000000000000010000000000", "000000000000000000001100110000000000",
                "000000000000000000010000010000000000", "000000000000000000001100010000000000", "000000000000000000000000010000000000",
                "000000000000000000000000100000000000", "000000000011000000000000000000000000", "000000000011000000000000000000000000",
                "000000110000001100000000000000000000", "000001000100001100000000000000000000", "110000000100001100000000000000000000",
                "110000001000000110000000000000000000", "000000110000000110000000000000000000", "000000000000000000000000000000000000",
                "000000000000000000000000000000000000", "000000000000000000000000000000000000", "000000000000000000000000000000000000"
            ]
        };

        function cellIndex(x, y) { return y * columns + x; }

        function setPattern(pattern) {
            cells.fill(0);
            const offsetX = Math.floor((columns - pattern[0].length) / 2);
            const offsetY = Math.floor((rows - pattern.length) / 2);
            pattern.forEach((line, y) => [...line].forEach((value, x) => {
                if (value === "1") cells[cellIndex(offsetX + x, offsetY + y)] = 1;
            }));
            generation = 0;
            peak = countPopulation();
            updateLabels();
            draw();
        }

        function countPopulation() { return cells.reduce((total, cell) => total + cell, 0); }

        function nextGeneration() {
            const next = new Uint8Array(cells.length);
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < columns; x++) {
                    let neighbors = 0;
                    for (let yOffset = -1; yOffset <= 1; yOffset++) {
                        for (let xOffset = -1; xOffset <= 1; xOffset++) {
                            if (xOffset === 0 && yOffset === 0) continue;
                            const neighborX = (x + xOffset + columns) % columns;
                            const neighborY = (y + yOffset + rows) % rows;
                            neighbors += cells[cellIndex(neighborX, neighborY)];
                        }
                    }
                    const alive = cells[cellIndex(x, y)] === 1;
                    next[cellIndex(x, y)] = neighbors === 3 || (alive && neighbors === 2) ? 1 : 0;
                }
            }
            cells = next;
            generation++;
            peak = Math.max(peak, countPopulation());
            updateLabels();
            draw();
        }

        function draw() {
            const pixelRatio = window.devicePixelRatio || 1;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            canvas.width = Math.floor(width * pixelRatio);
            canvas.height = Math.floor(height * pixelRatio);
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            const cellWidth = width / columns;
            const cellHeight = height / rows;
            context.fillStyle = "#0e1114";
            context.fillRect(0, 0, width, height);
            context.strokeStyle = "rgba(143, 163, 184, .08)";
            context.lineWidth = 1;
            for (let x = 0; x <= columns; x++) {
                context.beginPath(); context.moveTo(x * cellWidth, 0); context.lineTo(x * cellWidth, height); context.stroke();
            }
            for (let y = 0; y <= rows; y++) {
                context.beginPath(); context.moveTo(0, y * cellHeight); context.lineTo(width, y * cellHeight); context.stroke();
            }
            context.fillStyle = "#8fa3b8";
            for (let y = 0; y < rows; y++) for (let x = 0; x < columns; x++) {
                if (cells[cellIndex(x, y)]) context.fillRect(x * cellWidth + 1, y * cellHeight + 1, Math.max(1, cellWidth - 2), Math.max(1, cellHeight - 2));
            }
            emptyHint.classList.toggle("hidden", countPopulation() > 0);
        }

        function updateLabels() {
            const population = countPopulation();
            generationLabel.textContent = String(generation).padStart(4, "0");
            populationLabel.textContent = population;
            peakLabel.textContent = peak;
            liveState.textContent = running ? "运行中" : "已暂停";
            liveState.classList.toggle("paused", !running);
            playButton.textContent = running ? "暂停" : "开始";
        }

        function setRunning(value) {
            running = value;
            clearInterval(timer);
            timer = running ? setInterval(nextGeneration, 1000 / Number(speedInput.value)) : null;
            updateLabels();
        }

        function randomize() {
            const density = Number(densityInput.value) / 100;
            cells = Uint8Array.from({ length: columns * rows }, () => Math.random() < density ? 1 : 0);
            generation = 0;
            peak = countPopulation();
            updateLabels();
            draw();
        }

        canvas.addEventListener("click", (event) => {
            const bounds = canvas.getBoundingClientRect();
            const x = Math.floor((event.clientX - bounds.left) / bounds.width * columns);
            const y = Math.floor((event.clientY - bounds.top) / bounds.height * rows);
            if (x >= 0 && x < columns && y >= 0 && y < rows) {
                cells[cellIndex(x, y)] = cells[cellIndex(x, y)] ? 0 : 1;
                peak = Math.max(peak, countPopulation());
                updateLabels();
                draw();
            }
        });

        playButton.addEventListener("click", () => setRunning(!running));
        document.getElementById("stepButton").addEventListener("click", nextGeneration);
        document.getElementById("clearButton").addEventListener("click", () => { setRunning(false); cells.fill(0); generation = 0; peak = 0; updateLabels(); draw(); });
        document.getElementById("randomButton").addEventListener("click", randomize);
        document.getElementById("loadButton").addEventListener("click", () => setPattern(patterns[document.getElementById("patternSelect").value]));
        speedInput.addEventListener("input", () => { speedValue.textContent = `${speedInput.value} tps`; if (running) setRunning(true); });
        window.addEventListener("resize", draw);
        document.addEventListener("keydown", (event) => {
            if (event.target.matches("input, select")) return;
            if (event.code === "Space") { event.preventDefault(); setRunning(!running); }
            if (event.key.toLowerCase() === "n") nextGeneration();
            if (event.key.toLowerCase() === "r") randomize();
        });

        gridLabel.textContent = `${columns} × ${rows}`;
        setPattern(patterns.glider);
    </script>
</body>
</html>
