<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理沙盒</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: #fff;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: min(900px, 96vw);
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            margin: 0 0 12px;
            font-size: 24px;
        }

        /* canvas 保持在中间 */
        canvas {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #111;
            border: 2px solid #999;
            border-radius: 6px;
            cursor: crosshair;
            touch-action: none;
            image-rendering: pixelated;
        }

        /* 控制区域移到下方 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-top: 14px;      /* 从下方与画布隔开 */
            margin-bottom: 0;
        }

        button,
        select,
        input {
            font: inherit;
        }

        button,
        select {
            border: 0;
            border-radius: 6px;
            padding: 7px 10px;
            background: #3a414c;
            color: white;
            cursor: pointer;
        }

        button:hover,
        select:hover {
            background: #505967;
        }

        button.active {
            background: #d49b32;
            color: #181818;
        }

        #waterButton.active {
            background: #3d9be9;
            color: white;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hint {
            color: #b7bec8;
            text-align: center;
            font-size: 13px;
            margin-top: 9px;
        }
    </style>
</head>
<body>
    <main class="app">
        <h1>物理沙盒</h1>

        <!-- 画布在上方 -->
        <canvas id="canvas" width="160" height="120"></canvas>

        <!-- 工具栏放在画布下面，保留所有控件 -->
        <div class="toolbar">
            <button id="sandButton" class="active">放置沙子</button>
            <button id="waterButton">放置水</button>
            <button id="eraseButton">擦除</button>

            <label>
                笔刷：
                <input id="brushSize" type="range" min="1" max="8" value="2">
                <span id="brushValue">2</span>
            </label>

            <button id="pauseButton">暂停</button>
            <button id="clearButton">清空</button>
        </div>

        <div class="hint">
            沙子：向下或斜下移动；水：优先下落，否则左右随机走一格。
        </div>

        <div class="hint">
            AlCZn@我是人
        </div>
    </main>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const COLS = canvas.width;
        const ROWS = canvas.height;

        // 0：空，1：沙子，2：水
        const particles = Array.from(
            { length: ROWS },
            () => new Uint8Array(COLS)
        );

        const density = {
            0: 0,
            1: 2,
            2: 1
        };

        const gravity = { x: 0, y: 1 };

        let material = 1;
        let mode = "place";
        let paused = false;
        let drawing = false;

        const sandButton = document.getElementById("sandButton");
        const waterButton = document.getElementById("waterButton");
        const eraseButton = document.getElementById("eraseButton");
        const brushSize = document.getElementById("brushSize");
        const brushValue = document.getElementById("brushValue");
        const pauseButton = document.getElementById("pauseButton");
        const clearButton = document.getElementById("clearButton");

        function selectTool(nextMode, nextMaterial = material) {
            mode = nextMode;
            material = nextMaterial;

            sandButton.classList.toggle(
                "active",
                mode === "place" && material === 1
            );

            waterButton.classList.toggle(
                "active",
                mode === "place" && material === 2
            );

            eraseButton.classList.toggle(
                "active",
                mode === "erase"
            );
        }

        sandButton.addEventListener("click", () => {
            selectTool("place", 1);
        });

        waterButton.addEventListener("click", () => {
            selectTool("place", 2);
        });

        eraseButton.addEventListener("click", () => {
            selectTool("erase");
        });

        brushSize.addEventListener("input", () => {
            brushValue.textContent = brushSize.value;
        });

        pauseButton.addEventListener("click", () => {
            paused = !paused;
            pauseButton.textContent = paused ? "继续" : "暂停";
        });

        clearButton.addEventListener("click", () => {
            for (const row of particles) {
                row.fill(0);
            }
        });

        function paint(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = COLS / rect.width;
            const scaleY = ROWS / rect.height;

            const centerX = Math.floor(
                (event.clientX - rect.left) * scaleX
            );
            const centerY = Math.floor(
                (event.clientY - rect.top) * scaleY
            );

            const radius = Number(brushSize.value);

            for (let y = centerY - radius; y <= centerY + radius; y++) {
                for (let x = centerX - radius; x <= centerX + radius; x++) {
                    if (
                        x >= 0 &&
                        x < COLS &&
                        y >= 0 &&
                        y < ROWS &&
                        (x - centerX) ** 2 +
                        (y - centerY) ** 2 <= radius ** 2
                    ) {
                        particles[y][x] =
                            mode === "place" ? material : 0;
                    }
                }
            }
        }

        canvas.addEventListener("pointerdown", event => {
            drawing = true;
            canvas.setPointerCapture(event.pointerId);
            paint(event);
        });

        canvas.addEventListener("pointermove", event => {
            if (drawing) {
                paint(event);
            }
        });

        canvas.addEventListener("pointerup", () => {
            drawing = false;
        });

        canvas.addEventListener("pointercancel", () => {
            drawing = false;
        });

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }

            return array;
        }

        function inBounds(x, y) {
            return x >= 0 && x < COLS && y >= 0 && y < ROWS;
        }

        function pickWaterMove(x, y) {
            const downwardMoves = shuffle([
                [0, 1],
                [-1, 1],
                [1, 1]
            ]);

            for (const [dx, dy] of downwardMoves) {
                const nx = x + dx;
                const ny = y + dy;
                if (inBounds(nx, ny) && particles[ny][nx] === 0) {
                    return [dx, dy];
                }
            }

            const sideMoves = shuffle([
                [-1, 0],
                [1, 0]
            ]);

            for (const [dx, dy] of sideMoves) {
                const nx = x + dx;
                const ny = y + dy;
                if (inBounds(nx, ny) && particles[ny][nx] === 0) {
                    return [dx, dy];
                }
            }

            return null;
        }

        function moveParticles() {
            const cells = [];
            const moved = Array.from(
                { length: ROWS },
                () => new Uint8Array(COLS)
            );

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (particles[y][x]) {
                        cells.push({ x, y });
                    }
                }
            }

            cells.sort((a, b) => {
                const da = a.x * gravity.x + a.y * gravity.y;
                const db = b.x * gravity.x + b.y * gravity.y;
                return da - db;
            });

            for (let i = 0; i < cells.length - 1; i++) {
                if (Math.random() < 0.3) {
                    [cells[i], cells[i + 1]] = [cells[i + 1], cells[i]];
                }
            }

            const sideX = -gravity.y;
            const sideY = gravity.x;

            for (const { x, y } of cells) {
                if (moved[y][x]) {
                    continue;
                }

                const particle = particles[y][x];

                if (!particle) {
                    continue;
                }

                let move;

                if (particle === 1) {
                    const diagonalMoves = shuffle([
                        [gravity.x + sideX, gravity.y + sideY],
                        [gravity.x - sideX, gravity.y - sideY]
                    ]);

                    const moves = [
                        [gravity.x, gravity.y],
                        ...diagonalMoves
                    ];

                    for (const [dx, dy] of moves) {
                        const nx = x + dx;
                        const ny = y + dy;

                        if (
                            nx < 0 || nx >= COLS ||
                            ny < 0 || ny >= ROWS ||
                            moved[ny][nx]
                        ) {
                            continue;
                        }

                        const target = particles[ny][nx];

                        if (density[target] >= density[particle]) {
                            continue;
                        }

                        move = [dx, dy];
                        break;
                    }
                } else {
                    const downwardMoves = shuffle([
                        [gravity.x, gravity.y],
                        [gravity.x - 1, gravity.y + 1],
                        [gravity.x + 1, gravity.y + 1]
                    ]);

                    let foundDownward = false;

                    for (const [dx, dy] of downwardMoves) {
                        const nx = x + dx;
                        const ny = y + dy;

                        if (
                            nx < 0 || nx >= COLS ||
                            ny < 0 || ny >= ROWS ||
                            moved[ny][nx]
                        ) {
                            continue;
                        }

                        if (density[particles[ny][nx]] < density[particle]) {
                            move = [dx, dy];
                            foundDownward = true;
                            break;
                        }
                    }

                    if (!foundDownward) {
                        const nx = x + gravity.x;
                        const ny = y + gravity.y;

                        if (
                            nx >= 0 && nx < COLS &&
                            ny >= 0 && ny < ROWS &&
                            particles[ny][nx] === 1
                        ) {
                            const sx = nx + gravity.x;
                            const sy = ny + gravity.y;

                            if (
                                inBounds(sx, sy) &&
                                particles[sy][sx] === 0 &&
                                !moved[sy][sx]
                            ) {
                                particles[sy][sx] = 1;
                                particles[ny][nx] = 2;
                                particles[y][x] = 0;
                                moved[y][x] = 1;
                                moved[ny][nx] = 1;
                                moved[sy][sx] = 1;
                                continue;
                            }
                        }

                        const candidate = pickWaterMove(x, y);
                        if (candidate) {
                            move = candidate;
                        }
                    }
                }

                if (!move) {
                    continue;
                }

                const [dx, dy] = move;
                const nx = x + dx;
                const ny = y + dy;

                if (
                    nx < 0 || nx >= COLS ||
                    ny < 0 || ny >= ROWS ||
                    moved[ny][nx]
                ) {
                    continue;
                }

                const target = particles[ny][nx];

                if (density[target] >= density[particle]) {
                    continue;
                }

                particles[ny][nx] = particle;
                particles[y][x] = target;

                moved[y][x] = 1;
                moved[ny][nx] = 1;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, COLS, ROWS);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (particles[y][x] === 1) {
                        ctx.fillStyle = "#e4ad45";
                        ctx.fillRect(x, y, 1, 1);
                    } else if (particles[y][x] === 2) {
                        ctx.fillStyle = "#3d9be9";
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
        }

        let lastUpdate = 0;

        function loop(time) {
            if (!paused && time - lastUpdate > 25) {
                moveParticles();
                lastUpdate = time;
            }

            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
