<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alczn.github.io · 导航</title>
    <style>
      /* ==========================================================================
         Design System v1 —— 中性深色
         本块为四个页面共用的同一份 token，修改时请同步全部页面。
         ========================================================================== */
      :root {
        color-scheme: dark;

        /* 表面 */
        --bg: #0b0d0f;
        --bg-2: #101317;
        --panel: #14171b;
        --panel-2: #191d22;
        --line: #23282f;
        --line-strong: #333a43;

        /* 文字 */
        --ink: #e8ebef;
        --muted: #98a3ae;
        --faint: #6b7580;

        /* 强调（单一中性强调色） */
        --accent: #8fa3b8;
        --accent-ink: #10141a;
        --accent-soft: #232b34;
        --accent-line: #5c6d7f;

        /* 语义色 */
        --teal: #5fd0b0;
        --blue: #62a8f0;
        --amber: #d9a441;
        --green: #8fc76a;
        --red: #e0666a;

        /* 形状与节奏 */
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 16px;
        --gap: 14px;

        /* 字体 */
        --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        --font-mono: "SFMono-Regular", "SF Mono", "JetBrains Mono", "Fira Code",
          "Cascadia Code", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 20px;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 0%, rgba(143, 163, 184, 0.07), transparent 30rem),
          radial-gradient(circle at 90% 100%, rgba(95, 208, 176, 0.05), transparent 32rem),
          var(--bg);
        font-family: var(--font-sans);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      .app-shell {
        width: min(1120px, 100%);
        margin: 0 auto;
      }

      /* 排版 */
      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .page-title {
        margin: 0;
        font-size: clamp(30px, 5vw, 46px);
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .subtitle {
        max-width: 46rem;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      /* 面板 */
      .panel {
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        background: var(--panel);
      }

      .panel.pad {
        padding: 26px;
      }

      /* 页头 */
      .site-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }

      .header-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 4px;
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 12px;
      }

      .header-meta::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--teal);
        box-shadow: 0 0 10px rgba(95, 208, 176, 0.7);
      }

      /* 卡片网格 */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: var(--gap);
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--panel);
        color: inherit;
        text-decoration: none;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          transform 0.18s ease;
      }

      .card:hover {
        border-color: var(--line-strong);
        background: var(--panel-2);
        transform: translateY(-2px);
      }

      .card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .card-icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--bg-2);
        color: var(--accent);
      }

      .card-icon svg {
        width: 17px;
        height: 17px;
      }

      .card-arrow {
        color: var(--faint);
        transition:
          color 0.18s ease,
          transform 0.18s ease;
      }

      .card-arrow svg {
        width: 16px;
        height: 16px;
        display: block;
      }

      .card:hover .card-arrow {
        color: var(--accent);
        transform: translateX(3px);
      }

      .card-title {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .card-desc {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
      }

      .card-desc.is-placeholder {
        color: var(--faint);
        font-style: italic;
      }

      .card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-family: var(--font-mono);
        font-size: 11.5px;
      }

      /* 徽标 */
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg-2);
        color: var(--muted);
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      /* 页脚 */
      .site-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        margin-top: 22px;
        padding: 16px 4px 0;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-size: 12px;
      }

      @media (max-width: 620px) {
        body {
          padding: 20px 14px;
          justify-content: flex-start;
        }

        .panel.pad {
          padding: 20px 16px;
        }

        .page-title {
          font-size: 28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>

      <footer class="site-footer">

    </main>

</html>
