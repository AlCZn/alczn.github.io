<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html测试</title>
</head>
<body>
    <p>hello world</p>
    <h1>hello world</h1>
    <a href="https://luogu.com.cn/">洛谷</a>
    <br>
    <table border="1">
        <tr>
            <th>姓名</th>
            <th>年龄</th>
            <th>性别</th>
        </tr>
        <tr>
            <td>张三</td>
            <td>18</td>
            <td>男</td>
        </tr>
        <tr>
            <td>李四</td>
            <td>20</td>
            <td>女</td>
        </tr>
    </table>
    <button onclick="alert('hello world')">点击我</button>
    <button onclick="document.body.style.backgroundColor = 'red'">变红</button>
    <button onclick="document.body.style.backgroundColor = 'white'">变白</button>
    <button onclick="document.body.innerHTML += '<p>文字</p>'">增加文字</button>
    <br><br><br>
    <button onclick="document.getElementById('counter').innerText = parseInt(document.getElementById('counter').innerText) + 1">加一</button>
    <button onclick="document.getElementById('counter').innerText = parseInt(document.getElementById('counter').innerText) * 2">翻倍</button>
    <p id="counter">0</p>
    <p>二进制：</p>
    <input type="text" id="binaryInput" oninput="convertToDecimal()">
    <p>十进制：<span id="decimalOutput">0</span></p>
    <script>
        function convertToDecimal() {
            const binaryValue = document.getElementById('binaryInput').value;
            const decimalValue = parseInt(binaryValue, 2);
            document.getElementById('decimalOutput').innerText = isNaN(decimalValue) ? 0 : decimalValue;
        }
    </script>
    <br><br><br>
    <p>计时器：</p>
    <p id="timer">0</p>
    <button onclick="startTimer()">开始计时</button>
    <button onclick="stopTimer()">停止计时</button>
    <script>
        let timerInterval;
        let timerCount = 0;

        function startTimer() {
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    timerCount++;
                    document.getElementById('timer').innerText = timerCount;
                }, 10);
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    </script>

    <br><br><br>
    <p>随机数：</p>
    <button onclick="generateRandomNumber()">生成随机数</button>
    <p id="randomNumber">0</p>
    <script>
        function generateRandomNumber() {
            const randomNum = Math.floor(Math.random() * 100) + 1; // 生成1到100之间的随机数
            document.getElementById('randomNumber').innerText = randomNum;
        }
    </script>

    <br><br><br>
    <p>带ccs的按钮：</p>
    <button class="styled-button" onclick="startCountdown()">倒计时</button>
    <style>
        .styled-button {
            background-color: #4CAF50; /* 绿色背景 */
            border: none; /* 无边框 */
            color: white; /* 白色文字 */
            padding: 15px 32px; /* 内边距 */
            text-align: center; /* 文字居中 */
            text-decoration: none; /* 无下划线 */
            display: inline-block; /* 行内块元素 */
            font-size: 16px; /* 字体大小 */
            margin: 4px 2px; /* 外边距 */
            cursor: pointer; /* 鼠标指针 */
            border-radius: 8px; /* 圆角边框 */
        }

        .styled-button:hover {
            background-color: #45a049; /* 悬停时的背景颜色 */
        }
    </style>
    <p id="countdown">10.00</p>
    <script>
        let countdownInterval;

        function startCountdown() {
            let countdownValue = 10;
            document.getElementById('countdown').innerText = countdownValue;

            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            countdownInterval = setInterval(() => {
                countdownValue-=0.01;
                document.getElementById('countdown').innerText = countdownValue.toFixed(2);

                if (countdownValue <= 0) {
                    clearInterval(countdownInterval);
                    alert('倒计时结束！');
                }
            }, 10);
        }
    </script>

    <br><br><br>
    <p>表单</p>
    <form onsubmit="return validateForm()">
        <label for="username">用户名:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="email">邮箱:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="password">密码:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <input type="submit" value="提交">
    </form>

    <br><br><br>
    <p>隐藏式菜单</p>
    <div class="dropdown">
        <button class="dropbtn">菜单</button>
        <div class="dropdown-content">
            <a href="#">选项 1</a>
            <a href="#">选项 2</a>
            <a href="#">选项 3</a>
        </div>
    </div>
    <script>
        const dropdown = document.querySelector('.dropdown');
        const dropdownContent = document.querySelector('.dropdown-content');

        dropdown.addEventListener('click', () => {
            dropdownContent.style.display = dropdownContent.style.display === 'block' ? 'none' : 'block';
        });

        window.addEventListener('click', (event) => {
            if (!dropdown.contains(event.target)) {
                dropdownContent.style.display = 'none';
            }
        });
    </script>
    <style>
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background-color: #4CAF50;
            color: white;
            padding: 16px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1
        }
    </style>

    <br><br><br>
    <p>读取键盘按键</p>
    <p id="keyPressed">你按下了: 无</p>
    <script>
        document.addEventListener('keydown', (event) => {
            document.getElementById('keyPressed').innerText = `你按下了: ${event.key}`;
        });
    </script>
    <br><br>
    <p>组合键</p>
    <p>按下ctrl+alt+z或ctrl+alt+x</p>
    <p id="keyCombination">你按下了组合键: 无</p>
    <script>
        document.addEventListener('keydown', (event) => {
            if (event.ctrlKey && event.altKey && event.key === 'z') {
                document.getElementById('keyCombination').innerText = '你按下了组合键: Ctrl + Alt + Z';
            }
            if (event.ctrlKey && event.altKey && event.key === 'x') {
                document.getElementById('keyCombination').innerText = '你按下了组合键: Ctrl + Alt + X';
            }
        });
    </script>
    <br><br><br>
    <p>读取鼠标按键</p>
    <p id="mousePressed">你按下了鼠标按键: 无</p>
    <script>
        document.addEventListener('mousedown', (event) => {
            let button;
            switch (event.button) {
                case 0:
                    button = '左键';
                    break;
                case 1:
                    button = '中键';
                    break;
                case 2:
                    button = '右键';
                    break;
                default:
                    button = '未知';
            }
            document.getElementById('mousePressed').innerText = `你按下了鼠标按键: ${button}`;
        });
    </script>
    <br><br>
    <p>读取鼠标位置</p>
    <p id="mousePosition">鼠标位置: (0, 0)</p>
    <script>
        document.addEventListener('mousemove', (event) => {
            document.getElementById('mousePosition').innerText = `鼠标位置: (${event.clientX}, ${event.clientY})`;
        });
    </script>

</body>
</html>
